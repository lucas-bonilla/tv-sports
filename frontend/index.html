<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1117" />
  <meta name="description" content="Programación deportiva en TV" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="style.css" />
  <title>📺 Sports TV</title>
</head>
<body>
  <!-- Full-page loader: hides the staggered per-section loading so the page is
       revealed once the World Cup, TV schedule and padel data are all ready. -->
  <div id="page-loader" class="page-loader">
    <div class="spinner"></div>
  </div>

  <header>
    <h1>📺 Sports TV</h1>
    <div id="date-label" class="date-label">Cargando...</div>
    <button id="refresh-btn" class="refresh-btn" title="Actualizar">↻</button>
  </header>

  <!-- ===== Global filters (day + TV sports), control every section ===== -->
  <div class="global-sticky">
    <div class="filter-group">
      <div id="global-date-bar" class="filter-bar date-bar"></div>
      <div id="filter-bar" class="filter-bar"></div>
    </div>
  </div>

  <!-- ===== World Cup section ===== -->
  <section id="sec-wc" class="page-section">
    <div class="section-head">
      <h2 class="section-title section-title--lg">🏆 Mundial 2026</h2>
      <span id="wc-live-tag" class="section-live-tag" hidden></span>
    </div>

    <main id="wc-container">
      <div class="spinner"></div>
    </main>

    <!-- Group standings, collapsed by default -->
    <div id="wc-standings-block" class="padel-calendar-block" hidden>
      <button id="wc-standings-toggle" class="padel-calendar-toggle" aria-expanded="false">
        <span>📊 Clasificación por grupos</span>
        <span class="chevron">›</span>
      </button>
      <div id="wc-standings-body" class="padel-calendar-body" hidden></div>
    </div>

    <!-- Knockout bracket (fase eliminatoria), collapsed by default -->
    <div id="wc-bracket-block" class="padel-calendar-block" hidden>
      <button id="wc-bracket-toggle" class="padel-calendar-toggle" aria-expanded="false">
        <span>🏆 Fase eliminatoria <span id="wc-bracket-live-tag" class="section-live-tag" hidden></span></span>
        <span class="chevron">›</span>
      </button>
      <div id="wc-bracket-body" class="padel-calendar-body" hidden>
        <div id="wc-bracket-scroll" class="wc-bracket-scroll"></div>
      </div>
    </div>

    <div id="wc-updated" class="last-updated"></div>
  </section>

  <!-- ===== TV section ===== -->
  <section id="sec-tv" class="page-section">
    <main id="events-container">
      <div class="spinner"></div>
    </main>

    <div id="last-updated" class="last-updated"></div>
  </section>

  <!-- ===== Padel section ===== -->
  <section id="sec-padel" class="page-section">
    <div class="section-head">
      <h2 class="section-title">🎾 Pádel</h2>
      <span id="padel-live-tag" class="section-live-tag" hidden></span>
    </div>
    <div class="section-sticky">
      <div class="filter-group">
        <div id="padel-tournament-bar" class="filter-bar"></div>
      </div>
    </div>

    <main id="padel-container">
      <div class="spinner"></div>
    </main>

    <!-- Full-season calendar, collapsed by default -->
    <div id="padel-calendar-block" class="padel-calendar-block" hidden>
      <button id="padel-calendar-toggle" class="padel-calendar-toggle" aria-expanded="false">
        <span>📅 Calendario 2026</span>
        <span class="chevron">›</span>
      </button>
      <div id="padel-calendar-body" class="padel-calendar-body" hidden></div>
    </div>

    <div id="padel-updated" class="last-updated"></div>
  </section>

  <div id="quick-nav-panel" class="quick-nav-panel"></div>
  <button id="quick-nav-btn" class="quick-nav-btn" title="Ir a deporte">☰</button>
  <button id="back-to-top" class="back-to-top" title="Volver arriba">↑</button>

  <script src="app.js"></script>
  <script src="worldcup.js"></script>
  <script src="padel.js"></script>
  <script>
    // Kick off every section's initial load together and only reveal the page
    // once they've all settled, so no section flashes "no hay datos" first.
    (function () {
      var loader = document.getElementById("page-loader");
      var hide = function () {
        if (!loader || loader.classList.contains("hidden")) return;
        loader.classList.add("hidden");
        setTimeout(function () { loader.remove(); }, 300);
      };
      var loaders = [
        typeof fetchEvents === "function" ? fetchEvents : null,
        typeof fetchWorldCup === "function" ? fetchWorldCup : null,
        typeof fetchPadelTournaments === "function" ? fetchPadelTournaments : null,
      ].filter(Boolean);
      Promise.allSettled(loaders.map(function (f) { return f(); })).then(hide);
      // Safety net: never trap the page behind a hung request.
      setTimeout(hide, 15000);
    })();
  </script>
</body>
</html>
